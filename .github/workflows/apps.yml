name: Native apps

# River's native apps (apps/) are a separate Cargo workspace with their own
# lockfile and toolchain pin, so build.yml never compiles them. This workflow
# does: format, clippy, unit tests, and a headless render of every screen
# (setup, rooms and chat). river-app depends on river-core (common/) and
# compiles in three files from ui/ (the logo, the chat delegate WASM, whose
# hash is the delegate key it reads rooms from, and the room contract WASM,
# whose hash is part of the contract key of every room it creates or joins), so
# those are in both path lists too.
#
# GitHub-hosted ubuntu-latest, which is free on this public repo (see the
# runs-on comment in build.yml for why larger runners are not used).

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'common/**'
      # river-core inherits its dependency versions from the root manifest.
      - 'Cargo.toml'
      # A test checks the apps use the freenet-stdlib river-core resolves to here.
      - 'Cargo.lock'
      - 'ui/assets/river_logo.svg'
      - 'ui/public/contracts/chat_delegate.wasm'
      - 'ui/public/contracts/room_contract.wasm'
      - '.github/workflows/apps.yml'
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'common/**'
      # river-core inherits its dependency versions from the root manifest.
      - 'Cargo.toml'
      # A test checks the apps use the freenet-stdlib river-core resolves to here.
      - 'Cargo.lock'
      - 'ui/assets/river_logo.svg'
      - 'ui/public/contracts/chat_delegate.wasm'
      - 'ui/public/contracts/room_contract.wasm'
      - '.github/workflows/apps.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The desktop app's icons (apps/desktop/packaging/icons/) are generated from
  # the River logo and committed (see generate-icons.sh for why). Whoever
  # changes the logo regenerates them; this fails a PR that changes the logo
  # without touching them, so the release cannot ship the old icon unnoticed.
  icons-follow-logo:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Icons regenerated when the logo changed
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE...$HEAD")"
          if grep -qx 'ui/assets/river_logo.svg' <<<"$changed" \
             && ! grep -q '^apps/desktop/packaging/icons/' <<<"$changed"; then
            echo "::error::ui/assets/river_logo.svg changed but the desktop icons did not. Run apps/desktop/packaging/generate-icons.sh and commit apps/desktop/packaging/icons/."
            exit 1
          fi
          echo "OK"

  # The macOS and Windows install and start paths are compiled only on those
  # platforms. Standard GitHub-hosted runners are free on this public repo.
  other-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps
    steps:
      - uses: actions/checkout@v4

      # Rune links libxkbcommon and libwayland-client at build time; the
      # software Vulkan driver lets the headless renderer run with no GPU.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev mesa-vulkan-drivers

      # apps/rust-toolchain.toml pins the compiler; this installs it.
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

      # Render every named screen (setup and chat) and keep the PNGs for review. This
      # fails when rendering panics or writes nothing; it does not compare
      # pixels, so a blank screen passes. What each screen shows is checked by
      # the view tests in river-app.
      - name: Render screens
        run: |
          # The software Vulkan driver's file name varies by mesa version
          # (lvp_icd.json, lvp_icd.x86_64.json). Fail loudly if there is none,
          # rather than rendering on whatever else the loader finds.
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n1)
          test -n "$icd"
          export VK_ICD_FILENAMES="$icd"
          echo "Using $icd"
          cargo build --locked -p river-desktop
          mkdir -p snapshots
          scenes=$(./target/debug/river --list-scenes)
          test -n "$scenes"
          for scene in $scenes; do
            # A scene cannot set the window size, so the narrow-layout scenes
            # get it here. Keep this equal to NARROW_SCENE_SIZE in
            # apps/river-app/src/lib.rs, whose scene_size() makes the same
            # choice and is what the narrow_scenes_are_named_narrow test checks.
            size=()
            case "$scene" in *narrow*) size=(--size 820x720) ;; esac
            ./target/debug/river --snap "snapshots/$scene.png" --scene "$scene" --scale 2 "${size[@]}"
            test -s "snapshots/$scene.png"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: setup-screens
          path: apps/snapshots/
          if-no-files-found: ignore
