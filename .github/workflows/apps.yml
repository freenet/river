name: Native apps

# River's native apps (apps/) are a separate Cargo workspace with their own
# lockfile and toolchain pin, so build.yml never compiles them. This workflow
# does: format, clippy, unit tests, and a headless render of every screen
# (setup, rooms and chat). river-app depends on river-core (common/) and
# compiles in three files from ui/ (the logo, the chat delegate WASM, whose
# hash is the delegate key it reads rooms from, and the room contract WASM,
# whose hash is part of the contract key of every room it creates or joins), so
# those are in both path lists too.
#
# GitHub-hosted ubuntu-latest, which is free on this public repo (see the
# runs-on comment in build.yml for why larger runners are not used).

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'common/**'
      # river-core inherits its dependency versions from the root manifest.
      - 'Cargo.toml'
      # A test checks the apps use the freenet-stdlib river-core resolves to here.
      - 'Cargo.lock'
      - 'ui/assets/river_logo.svg'
      - 'ui/src/util/share_link.rs'
      - 'ui/src/util/share-link-vectors.json'
      - 'ui/src/util/confusable.rs'
      - 'ui/src/util/display_name.rs'
      - 'ui/src/components/conversation/emoji_picker.rs'
      - 'ui/public/contracts/chat_delegate.wasm'
      - 'ui/public/contracts/room_contract.wasm'
      # The app reads River's pointer records to tell when River has moved past the WASM
      # it carries, and a test checks the author key against FREENET.md.
      - 'pointer-records.toml'
      # The app carries rooms over from the earlier chat delegates this registry lists.
      - 'legacy_delegates.toml'
      - 'FREENET.md'
      - '.github/workflows/apps.yml'
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'common/**'
      # river-core inherits its dependency versions from the root manifest.
      - 'Cargo.toml'
      # A test checks the apps use the freenet-stdlib river-core resolves to here.
      - 'Cargo.lock'
      - 'ui/assets/river_logo.svg'
      - 'ui/src/util/share_link.rs'
      - 'ui/src/util/share-link-vectors.json'
      - 'ui/src/util/confusable.rs'
      - 'ui/src/util/display_name.rs'
      - 'ui/src/components/conversation/emoji_picker.rs'
      - 'ui/public/contracts/chat_delegate.wasm'
      - 'ui/public/contracts/room_contract.wasm'
      # The app reads River's pointer records to tell when River has moved past the WASM
      # it carries, and a test checks the author key against FREENET.md.
      - 'pointer-records.toml'
      # The app carries rooms over from the earlier chat delegates this registry lists.
      - 'legacy_delegates.toml'
      - 'FREENET.md'
      - '.github/workflows/apps.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The desktop app's icons (apps/desktop/packaging/icons/) are generated from
  # the River logo and committed (see generate-icons.sh for why). Whoever
  # changes the logo regenerates them; this fails a PR that changes the logo
  # without touching them, so the release cannot ship the old icon unnoticed.
  icons-follow-logo:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Icons regenerated when the logo changed
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # --no-renames: a renamed or deleted logo shows up under its old path.
          changed="$(git diff --name-only --no-renames "$BASE...$HEAD")"
          if grep -qx 'ui/assets/river_logo.svg' <<<"$changed" \
             && ! grep -q '^apps/desktop/packaging/icons/' <<<"$changed"; then
            echo "::error::ui/assets/river_logo.svg changed but the desktop icons did not. Run apps/desktop/packaging/generate-icons.sh and commit apps/desktop/packaging/icons/."
            exit 1
          fi
          echo "OK"

  # The macOS and Windows install and start paths are compiled only on those
  # platforms. Standard GitHub-hosted runners are free on this public repo.
  other-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

  # Format, clippy and unit tests. The screen renders and the self-update checks
  # are separate jobs below so the three run in parallel: run in sequence they
  # took about 20 minutes on main and hit the 30-minute limit on branches. All
  # three restore one rust-cache key; only this job saves it, because it builds the
  # most (dev-dependencies, clippy, tests). A faster job saving first would store a
  # cache without those and every later run would rebuild them here.
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps
    steps:
      - uses: actions/checkout@v4

      # Rune links libxkbcommon and libwayland-client at build time; the
      # software Vulkan driver lets the headless renderer run with no GPU.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev mesa-vulkan-drivers

      # apps/rust-toolchain.toml pins the compiler; this installs it.
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps
          shared-key: apps-desktop

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

  # Render every named screen headlessly and keep the PNGs for review (the step's
  # comment says what it does and does not check).
  desktop-screens:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps
    steps:
      - uses: actions/checkout@v4

      # Rune links libxkbcommon and libwayland-client at build time; the
      # software Vulkan driver lets the headless renderer run with no GPU.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev mesa-vulkan-drivers

      # apps/rust-toolchain.toml pins the compiler; this installs it.
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps
          shared-key: apps-desktop
          # Restore only: the desktop job saves this key (see the comment above it).
          save-if: false

      # Render every named screen (setup and chat) and keep the PNGs for review. This
      # fails when rendering panics or writes nothing; it does not compare
      # pixels, so a blank screen passes. What each screen shows is checked by
      # the view tests in river-app.
      - name: Render screens
        run: |
          # The software Vulkan driver's file name varies by mesa version
          # (lvp_icd.json, lvp_icd.x86_64.json). Fail loudly if there is none,
          # rather than rendering on whatever else the loader finds.
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n1)
          test -n "$icd"
          export VK_ICD_FILENAMES="$icd"
          echo "Using $icd"
          cargo build --locked -p river-desktop
          mkdir -p snapshots
          scenes=$(./target/debug/river --list-scenes)
          test -n "$scenes"
          for scene in $scenes; do
            # A scene cannot set the window size, so the narrow-layout scenes
            # get it here. Keep this equal to NARROW_SCENE_SIZE in
            # apps/river-app/src/lib.rs, whose scene_size() makes the same
            # choice and is what the narrow_scenes_are_named_narrow test checks.
            size=()
            case "$scene" in *narrow*) size=(--size 820x720) ;; esac
            ./target/debug/river --snap "snapshots/$scene.png" --scene "$scene" --scale 2 "${size[@]}"
            test -s "snapshots/$scene.png"
          done

          # The same app on a light system: a few screens that cover the chat
          # screen, a dialog, a warning and a setup card, for review. Each must
          # differ from its dark render.
          for scene in chat chat-settings-appearance chat-settings-about chat-similar-name not-installed-node-warning; do
            ./target/debug/river --snap "snapshots/light-$scene.png" --scene "$scene" --scale 2 --theme light
            test -s "snapshots/light-$scene.png"
            # rune treats any --theme other than "light" as dark, so a light render
            # that is byte-identical to the dark one did not render light.
            ./target/debug/river --snap "snapshots/dark-$scene.png" --scene "$scene" --scale 2 --theme dark
            test -s "snapshots/dark-$scene.png"
            # (`! cmp` would not fail the step: set -e ignores a negated command.)
            if cmp -s "snapshots/light-$scene.png" "snapshots/dark-$scene.png"; then
              echo "::error::light-$scene.png is identical to the dark render"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: setup-screens
          path: apps/snapshots/
          if-no-files-found: ignore

  # River's self-update checks against a local server (see the step's comment).
  desktop-update-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps
    steps:
      - uses: actions/checkout@v4

      # Rune links libxkbcommon and libwayland-client at build time. This job renders
      # nothing; it installs the same packages as the other two so the builds match.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev mesa-vulkan-drivers

      # apps/rust-toolchain.toml pins the compiler; this installs it.
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps
          shared-key: apps-desktop
          # Restore only: the desktop job saves this key (see the comment above it).
          save-if: false

      # River's self-update against a local server with a throwaway key: a current manifest
      # is "up to date", and tampered, unsigned, wrongly signed and replayed manifests are
      # refused with the installed binary unchanged (see the script's header).
      - name: Self-update checks
        run: scripts/update-ci.sh

  # The app on two Freenet nodes River never ran on (apps/scripts/fresh-node-e2e.sh):
  # it registers the chat delegate on each, creates a room and an invitation on one,
  # joins from it on the other, and each receives the other's message. Runs on two pinned
  # Freenet releases. 0.2.157 is the baseline: the oldest release the desktop app installs
  # (and what this job ran on before it had a matrix). 0.2.164 is the latest release as of
  # this change. Both are explicit versions, never "latest", and the second is bumped
  # deliberately in a PR of its own when a newer release should be covered.
  fresh-node-e2e:
    name: fresh-node-e2e (freenet ${{ matrix.freenet }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        freenet: ['0.2.157', '0.2.164']
    env:
      FREENET_VERSION: ${{ matrix.freenet }}
    defaults:
      run:
        working-directory: apps
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev

      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps

      # Checked against the release's SHA256SUMS.txt. The app's own installer also
      # verifies that file's signature; this job only needs the binary to be the one
      # published.
      - name: Download Freenet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/freenet"
          cd "$RUNNER_TEMP/freenet"
          gh release download "v$FREENET_VERSION" --repo freenet/freenet-core \
            --pattern 'freenet-x86_64-unknown-linux-musl.tar.gz' --pattern 'SHA256SUMS.txt'
          grep ' freenet-x86_64-unknown-linux-musl.tar.gz$' SHA256SUMS.txt | sha256sum -c -
          tar xzf freenet-x86_64-unknown-linux-musl.tar.gz
          # The archive stores the binary without its execute bit.
          chmod +x freenet
          ./freenet --version
          # The binary must be the version this leg claims to test.
          # First line is "Freenet version: X.Y.Z (<sha>)".
          ./freenet --version | head -n1 | grep -qF "Freenet version: $FREENET_VERSION ("

      - name: Fresh-node end-to-end
        run: FREENET_BIN="$RUNNER_TEMP/freenet/freenet" ./scripts/fresh-node-e2e.sh "$RUNNER_TEMP/e2e"

      # The script prints the ends of the node logs and their delegate lines; a failure
      # may need all of it (#1017: the info lines that name the delegate request were not
      # in the output). Also on cancel, which is how a hang that reaches the job's
      # timeout ends.
      - name: Upload node logs
        uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: fresh-node-e2e-logs-${{ matrix.freenet }}
          path: |
            ${{ runner.temp }}/e2e/gw/stdout.log
            ${{ runner.temp }}/e2e/gw/log/
            ${{ runner.temp }}/e2e/peer/stdout.log
            ${{ runner.temp }}/e2e/peer/log/
          if-no-files-found: warn
          overwrite: true
          retention-days: 14
