name: Release desktop app

# Tag-triggered release of River's native desktop app (apps/, binary `river`).
#
# This is the desktop app ONLY. riverctl has release-riverctl.yml, and the River
# web UI is published to Freenet with `cargo make publish-river`
# (.claude/rules/river-publish.md).
#
# Release flow:
#   1. Bump [workspace.package] version in apps/Cargo.toml through a normal PR,
#      merge to main.
#   2. git tag river-desktop-v<version> <main commit> && git push origin river-desktop-v<version>
#   3. This workflow verifies the tag, builds and tests on all three platforms,
#      signs (macOS: Developer ID + notarization; Windows: Azure Artifact
#      Signing), and creates a GitHub prerelease with SHA256SUMS.txt.
#
# `verify` refuses the tag unless it matches apps/Cargo.toml, the commit is on
# main, and ui/public/contracts/ is byte-identical to the last published River
# web UI (see apps/desktop/packaging/verify-release.sh for why and how).
#
# On pull requests that touch the packaging, the build and package jobs run
# without secrets, so packaging is checked on every platform before any tag.
# Signing and the release run only for tags.
#
# Signing secrets live in the `release` environment (same names as
# freenet-core): APPLE_DEVELOPER_ID_P12_BASE64, APPLE_DEVELOPER_ID_P12_PASSWORD,
# APPLE_ASC_API_KEY_P8_BASE64, APPLE_ASC_API_KEY_ID, APPLE_ASC_API_KEY_ISSUER_ID,
# AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID. The Entra federated
# credential must be for subject repo:freenet/river:environment:release.
#
# SHA256SUMS.txt is deliberately NOT signed with FREENET_RELEASE_SIGNING_KEY:
# that key is the trust root of Freenet's own auto-updater and must not vouch
# for anything else.

on:
  push:
    tags:
      - 'river-desktop-v*'
  pull_request:
    paths:
      - '.github/workflows/release-desktop.yml'
      - 'apps/desktop/packaging/**'
      - 'apps/desktop/build.rs'
      - 'apps/desktop/Cargo.toml'
      # The release profile lives here.
      - 'apps/Cargo.toml'

# Least privilege: read-only by default. sign-windows adds id-token: write and
# github-release adds contents: write, each for itself only.
permissions:
  contents: read

concurrency:
  group: release-desktop-${{ github.ref }}
  # Never cancel a release half way (a signed but unreleased build wastes
  # notarization and signing quota); superseded PR runs may be cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  IS_RELEASE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/river-desktop-v') }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
      webapp_version: ${{ steps.check.outputs.webapp_version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Verify tag, main ancestry and baked-in WASM
        id: check
        run: |
          set -euo pipefail
          if [ "$IS_RELEASE" = "true" ]; then
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            apps/desktop/packaging/verify-release.sh "$GITHUB_REF_NAME" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            # Pull request: no tag to check; package the version in the tree.
            version="$(python3 -c 'import tomllib; print(tomllib.load(open("apps/Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "webapp_version=" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  build-linux:
    needs: verify
    # The oldest supported Ubuntu runner, so the binary's glibc floor is 2.35
    # rather than ubuntu-latest's 2.39.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    defaults:
      run:
        working-directory: apps
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev desktop-file-utils
      # apps/rust-toolchain.toml pins the compiler; this installs it.
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Tests
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked -p river-desktop
      - name: Validate river.desktop
        run: desktop-file-validate desktop/packaging/linux/river.desktop
      - name: Package
        run: desktop/packaging/package-linux.sh target/release/river "$VERSION" ../dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # Linux is not signed, so this is the release asset as-is.
          name: release-linux
          path: dist/River-*-linux-x86_64.tar.gz
          if-no-files-found: error

  build-macos:
    needs: verify
    # Apple silicon. x86_64 is cross-compiled here (GitHub is retiring the
    # Intel runners), and the two are combined into one universal binary.
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    defaults:
      run:
        working-directory: apps
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install toolchain and targets
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      # Native arm64 only: the runner cannot execute x86_64 test binaries.
      - name: Tests
        run: cargo test --locked
      - name: Build arm64 and x86_64
        run: |
          cargo build --release --locked -p river-desktop --target aarch64-apple-darwin
          cargo build --release --locked -p river-desktop --target x86_64-apple-darwin
      - name: Assemble River.app (unsigned)
        run: |
          desktop/packaging/package-macos.sh \
            target/aarch64-apple-darwin/release/river \
            target/x86_64-apple-darwin/release/river \
            "$VERSION" ../dist
      # Catches a bundle layout codesign would reject (stray files, bad
      # Info.plist) on pull requests, before a release needs the real identity.
      # Signs a copy ad hoc; the uploaded bundle stays unsigned.
      - name: Check the bundle is signable
        run: |
          cp -R ../dist/River.app "$RUNNER_TEMP/River.app"
          codesign --force --options runtime --sign - "$RUNNER_TEMP/River.app"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/River.app"
      # upload-artifact drops file modes; a tarball keeps the executable bit.
      - name: Archive River.app
        run: tar -czf ../dist/River-unsigned.app.tar.gz -C ../dist River.app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-macos
          path: dist/River-unsigned.app.tar.gz
          if-no-files-found: error

  build-windows:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    defaults:
      run:
        working-directory: apps
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Tests
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked -p river-desktop
      # Checks the version resource and the zip on pull requests too. A release
      # repeats this in sign-windows, on the signed exe.
      - name: Package (unsigned, for checking)
        shell: pwsh
        run: desktop/packaging/package-windows.ps1 -Exe target/release/river.exe -Version $env:VERSION -OutDir ../dist -Suffix '-UNSIGNED'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-windows
          path: |
            apps/target/release/river.exe
            dist/River-*-UNSIGNED.zip
          if-no-files-found: error

  sign-macos:
    needs: [verify, build-macos]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/river-desktop-v')
    runs-on: macos-latest
    timeout-minutes: 45
    environment: release
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Check signing secrets are present
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_ASC_API_KEY_P8_BASE64: ${{ secrets.APPLE_ASC_API_KEY_P8_BASE64 }}
          APPLE_ASC_API_KEY_ID: ${{ secrets.APPLE_ASC_API_KEY_ID }}
          APPLE_ASC_API_KEY_ISSUER_ID: ${{ secrets.APPLE_ASC_API_KEY_ISSUER_ID }}
        run: |
          missing=0
          for v in APPLE_DEVELOPER_ID_P12_BASE64 APPLE_DEVELOPER_ID_P12_PASSWORD \
                   APPLE_ASC_API_KEY_P8_BASE64 APPLE_ASC_API_KEY_ID APPLE_ASC_API_KEY_ISSUER_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret $v is not set in the 'release' environment of freenet/river."
              missing=1
            fi
          done
          exit "$missing"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unsigned-macos
          path: unsigned
      - name: Unpack River.app
        run: |
          mkdir -p dist
          tar -xzf unsigned/River-unsigned.app.tar.gz -C dist
      - name: Import Developer ID certificate into a temporary keychain
        env:
          P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          echo "$P12_BASE64" | base64 -d > "$CERT_PATH"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # Put it first in the search list, keeping the existing keychains.
          # (A read loop, not mapfile, which the macOS system bash 3.2 lacks.)
          existing=()
          while IFS= read -r k; do existing+=("$k"); done \
            < <(security list-keychains -d user | tr -d '"' | sed 's/^[[:space:]]*//')
          security list-keychains -d user -s "$KEYCHAIN_PATH" ${existing[@]+"${existing[@]}"}
          rm "$CERT_PATH"
      - name: Decode App Store Connect API key
        env:
          P8_BASE64: ${{ secrets.APPLE_ASC_API_KEY_P8_BASE64 }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "$P8_BASE64" | base64 -d > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
      - name: Sign, notarize, staple and verify
        env:
          CODESIGN_IDENTITY: "Developer ID Application: Ian CLARKE (R55ZESJCXG)"
          EXPECTED_TEAM_ID: R55ZESJCXG
          ASC_API_KEY_ID: ${{ secrets.APPLE_ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.APPLE_ASC_API_KEY_ISSUER_ID }}
        run: |
          apps/desktop/packaging/sign-macos.sh dist/River.app \
            "release/River-$VERSION-macos-universal.zip"
      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12" || true
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-macos
          path: release/River-*-macos-universal.zip
          if-no-files-found: error

  sign-windows:
    needs: [verify, build-windows]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/river-desktop-v')
    runs-on: windows-latest
    timeout-minutes: 30
    # The Entra federated credential is pinned to
    # repo:freenet/river:environment:release, so only a job that declares this
    # environment can get an Azure token; signing fails closed anywhere else.
    environment: release
    # OIDC to Azure. Naming any permission drops the rest, so restate contents.
    permissions:
      id-token: write
      contents: read
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Check signing secrets are present
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          missing=0
          for v in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret $v is not set in the 'release' environment of freenet/river."
              missing=1
            fi
          done
          exit "$missing"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unsigned-windows
          path: unsigned
      # Sign a copy in its own folder, so nothing else can be signed by accident.
      - name: Stage river.exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path unsigned -Recurse -Filter river.exe | Select-Object -First 1
          if (-not $exe) { throw 'river.exe missing from the build artifact' }
          New-Item -ItemType Directory -Force -Path signing | Out-Null
          Copy-Item $exe.FullName signing\river.exe
      - name: Azure login (OIDC)
        timeout-minutes: 10
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign river.exe (Azure Artifact Signing)
        timeout-minutes: 15
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: freenetsigning
          certificate-profile-name: freenet-public-trust
          files: ${{ github.workspace }}\signing\river.exe
          file-digest: SHA256
          # Required: the certificates live about three days, so without a
          # timestamp the signature stops validating almost at once.
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      # The gate: fail rather than ship an unsigned exe or one signed by
      # someone else. Matches the CN substring only, as freenet-core does:
      # PowerShell and osslsigncode render the rest of the subject differently.
      - name: Verify signature
        shell: pwsh
        run: |
          $f = 'signing\river.exe'
          $sig = Get-AuthenticodeSignature $f
          Write-Host "$f => $($sig.Status) / $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "Unsigned or invalid: $f" }
          if (-not $sig.TimeStamperCertificate) { throw "Missing timestamp: $f" }
          if ($sig.SignerCertificate.Subject -notlike '*CN=Freenet Project Inc*') {
            throw "Unexpected signer for ${f}: expected a subject containing 'CN=Freenet Project Inc', got '$($sig.SignerCertificate.Subject)'. Do NOT delete this check to unblock a release."
          }
      - name: Package
        shell: pwsh
        run: apps/desktop/packaging/package-windows.ps1 -Exe signing/river.exe -Version $env:VERSION -OutDir release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-windows
          path: release/River-*-windows-x86_64.zip
          if-no-files-found: error

  github-release:
    needs: [verify, build-linux, sign-macos, sign-windows]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/river-desktop-v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # create the release; this job only
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      WEBAPP_VERSION: ${{ needs.verify.outputs.webapp_version }}
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Check assets and write SHA256SUMS.txt
        run: |
          set -euo pipefail
          cd dist
          for f in "River-$VERSION-linux-x86_64.tar.gz" \
                   "River-$VERSION-macos-universal.zip" \
                   "River-$VERSION-windows-x86_64.zip"; do
            test -s "$f" || { echo "::error::missing release asset $f"; exit 1; }
          done
          if [ "$(find . -mindepth 1 -maxdepth 1 | wc -l)" -ne 3 ]; then
            echo "::error::unexpected files in dist:"; ls -l; exit 1
          fi
          sha256sum River-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      # BLAKE3 is the code hash Freenet keys contracts and delegates by.
      - name: Install b3sum
        working-directory: ${{ runner.temp }}
        run: command -v b3sum || cargo install b3sum --locked --version 1.8.5
      - name: Write release notes header
        run: |
          set -euo pipefail
          delegate="$(b3sum --no-names ui/public/contracts/chat_delegate.wasm)"
          contract="$(b3sum --no-names ui/public/contracts/room_contract.wasm)"
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          Preview release of River for the desktop: Linux x86_64, macOS (Apple silicon and Intel; signed and notarized) and Windows x86_64 (signed). \`SHA256SUMS.txt\` lists the SHA-256 of each download.

          Built from ${GITHUB_SHA}. It carries the same chat delegate and room contract as the River web app published as version **${WEBAPP_VERSION}**:

          | WASM | BLAKE3 code hash |
          |---|---|
          | \`chat_delegate.wasm\` | \`${delegate}\` |
          | \`room_contract.wasm\` | \`${contract}\` |

          EOF
          cat "$RUNNER_TEMP/notes.md"
      - name: Create or update the GitHub release
        run: |
          set -euo pipefail
          args=(--verify-tag --title "River desktop v${VERSION}"
                --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
                # riverctl releases currently own the repo's "Latest" badge.
                --latest=false)
          # Generated notes cover changes since the previous desktop release,
          # not since whichever riverctl tag happens to be newest.
          # The desktop tag just below this one in version order.
          prev="$(git tag --list 'river-desktop-v*' | sort -V \
                  | awk -v t="$TAG" '$0 == t { print p; exit } { p = $0 }')"
          if [ -n "$prev" ]; then
            echo "Notes start at $prev"
            args+=(--notes-start-tag "$prev")
          fi
          case "$VERSION" in
            0.*) args+=(--prerelease) ;;
          esac
          # Idempotent: a re-run after a transient failure replaces the assets.
          if ! gh release create "$TAG" "${args[@]}" dist/*; then
            echo "Release $TAG already exists; uploading assets with --clobber"
            gh release upload "$TAG" dist/* --clobber
          fi
