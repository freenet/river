name: Build

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop
      - 'releases/**'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: freenet-default-runner

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
    
    - name: Cache cargo
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
    
    - name: Cache cargo-make
      uses: actions/cache@v3
      with:
        path: ~/.cargo/bin/cargo-make
        key: ${{ runner.os }}-cargo-make
    
    - name: Install cargo-make
      uses: actions-rs/cargo@v1
      with:
        command: install
        args: --force cargo-make

    - name: Install cargo-binstall
      uses: taiki-e/install-action@cargo-binstall

    - name: Cache Dioxus CLI
      id: cache-dioxus-cli
      uses: actions/cache@v3
      with:
        path: ~/.cargo/bin/dx
        # Re-key on ui/Cargo.toml so a dioxus version bump invalidates the
        # cached `dx` rather than pinning it to a stale CLI version forever.
        key: ${{ runner.os }}-dioxus-cli-${{ hashFiles('ui/Cargo.toml') }}

    - name: Install Dioxus CLI
      # Gate on the cache *result*, not on whether the file exists:
      # freenet-default-runner is self-hosted, so a stale ~/.cargo/bin/dx can
      # persist from an earlier job even when this key misses (e.g. after a
      # dioxus bump). A file-existence check would then skip the install and
      # use the stale CLI; a cache-key miss must always (re)install.
      #
      # Pass GITHUB_TOKEN so binstall makes authenticated GitHub API requests
      # (5000/hr) instead of unauthenticated ones (60/hr). The unauthenticated
      # limit was getting hit, returning 403, forcing a from-source build that
      # then failed on a broken transitive dep (freenet/river#316).
      if: steps.cache-dioxus-cli.outputs.cache-hit != 'true'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: cargo binstall -y --force dioxus-cli

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install npm dependencies for Tailwind
      run: npm install
      working-directory: ./ui

    # `--locked` asserts the committed Cargo.lock is complete and consistent
    # before any build runs (freenet/river#2776 A1). The lock is the single
    # source of truth for the dependency graph — including the
    # rustc-1.94.1-compatible pins (constant_time_eq 0.4.2, which feeds the
    # contract/delegate WASM via blake3; time 0.3.51, so cookie 0.18.1 in the
    # room-contract `net` dev-deps compiles). This replaced the old per-run
    # `cargo update --precise` workarounds, which existed only because the lock
    # was gitignored and CI re-resolved every run.
    - name: Prefetch dependencies
      run: cargo fetch --locked

    - name: Build Project
      run: cargo make build

    - name: Check every workspace member has a test step
      # Guards the CLASS of gap that the per-crate steps below have each closed
      # one instance of (freenet/river#614). A crate added to [workspace]
      # members without a `cargo test -p <crate>` step here now fails CI,
      # instead of shipping tests that quietly never execute — which is what
      # the chat-delegate did for its entire existence.
      run: ./scripts/check-ci-test-coverage.sh

    - name: Test room-contract
      env:
        RUST_MIN_STACK: 8388608
        CARGO_TARGET_DIR: ${{ github.workspace }}/target
      run: cargo test --package room-contract --features net

    - name: Test delegate key
      env:
        RUST_MIN_STACK: 8388608
        CARGO_TARGET_DIR: ${{ github.workspace }}/target
      run: cargo test -p river-core --test delegate_key_test

    - name: Test migration entries
      env:
        RUST_MIN_STACK: 8388608
        CARGO_TARGET_DIR: ${{ github.workspace }}/target
      run: cargo test -p river-core --test migration_test

    - name: Test room-contract migration registry (#292)
      env:
        RUST_MIN_STACK: 8388608
        CARGO_TARGET_DIR: ${{ github.workspace }}/target
      # Validates common/legacy_room_contracts.toml is well-formed. A separate
      # --test target from migration_test, so it needs its own invocation.
      run: cargo test -p river-core --test room_contract_migration_test

    - name: Test river-core integration tests (all targets)
      env:
        RUST_MIN_STACK: 8388608
        CARGO_TARGET_DIR: ${{ github.workspace }}/target
      # `--tests`, NOT another `--test <name>` entry. The named-target steps
      # above are an allowlist, and a file missing from it is neither run nor
      # even COMPILED — which is how `ban_purges_authored_content_test.rs`
      # (added by #471 as the tripwire for the ban sweep both clients' reply-
      # quote suppression depends on) shipped without ever running, alongside
      # eight other common/tests files. A catch-all cannot silently omit a
      # newly-added file. The named steps are kept for failure attribution.
      run: cargo test -p river-core --tests

    - name: Test riverctl (CLI crate unit tests, incl. #292 recovery)
      env:
        RUST_MIN_STACK: 8388608
        CARGO_TARGET_DIR: ${{ github.workspace }}/target
      # riverctl carries native unit tests (legacy-key derivation parity,
      # upgrade-chain cycle guards). No prior step ran or even compiled them.
      run: cargo test -p riverctl --lib

    - name: Test river-core lib (room_state, crypto, CRDT unit tests)
      env:
        RUST_MIN_STACK: 8388608
        CARGO_TARGET_DIR: ${{ github.workspace }}/target
      # Runs the river-core library unit tests — room_state verification,
      # CRDT convergence, contract-migration regressions, etc. Previously
      # only the `ecies`-named subset ran in CI (see the step below), so the
      # bulk of the suite had no CI coverage.
      run: cargo test -p river-core --lib

    - name: Test river-core lib (ecies + migration registry)
      env:
        RUST_MIN_STACK: 8388608
        CARGO_TARGET_DIR: ${{ github.workspace }}/target
      # Runs the determinism + known-answer + backward-compat tests for the
      # deterministic `encrypt_secret_for_member` path used by the chat
      # delegate, plus the randomized-helper round-trips used by the UI.
      # See freenet/river#241 — these tests pin the wire format and catch
      # silent drift in the ECIES derivation. The `migration` feature also
      # gates the `migration` module's unit tests (legacy room-contract key
      # derivation, newest-first ordering — freenet/river#292). The `mentions`
      # feature gates the `mention` module's codec tests (token encode/parse,
      # lossless id hex, sanitization, typed-mention resolution) — without it
      # those 12 tests are compiled out and never gate.
      #
      # `--features` takes ONE comma-separated value; passing space-separated
      # feature names makes cargo treat the extras as positional test-name
      # filters (and a second one is a hard "unexpected argument" error).
      # `ecies-randomized` enables `ecies` transitively.
      run: cargo test -p river-core --lib --features ecies-randomized,migration,mentions

    - name: Test river-ui (UI crate unit tests)
      env:
        RUST_MIN_STACK: 8388608
        CARGO_TARGET_DIR: ${{ github.workspace }}/target
      # The river-ui crate carries native unit tests (pure helpers such as
      # unread counting, room-data merge logic, signing). They had no CI
      # coverage before — the WASM build can't run them and no step invoked
      # `cargo test -p river-ui`. This step gates them on every push.
      run: cargo test -p river-ui --bins

    - name: Test river-ui (example-data fixture tests)
      env:
        RUST_MIN_STACK: 8388608
        CARGO_TARGET_DIR: ${{ github.workspace }}/target
      # The example_data module (and its tests — the deep/at-cap windowing
      # fixture pins for freenet/river#501/#505) only compiles behind the
      # example-data feature, so the featureless run above never executes
      # them. Without this step a fixture regression that vacuates the
      # windowing Playwright specs would pass CI silently.
      run: cargo test -p river-ui --bins --features example-data,no-sync

    - name: Test chat-delegate (delegate dispatch, CAS envelopes, room subscription)
      env:
        RUST_MIN_STACK: 8388608
        CARGO_TARGET_DIR: ${{ github.workspace }}/target
      # 40 unit tests that had never run in CI (freenet/river#614) — the
      # `Makefile.toml` `test-chat-delegate` task existed, but no workflow
      # invoked it, so they gated only a developer's local `cargo make test`.
      # That mattered more here than for a normal crate: this is where River's
      # secret storage and its delegate-re-key migration path live, and the
      # delegate is re-keyed roughly weekly (see freenet/river#612).
      #
      # No `--target x86_64-unknown-linux-gnu` pin, unlike the Makefile task.
      # The pin there pairs with `--target-dir target/native` to keep a local
      # host build from clobbering the wasm artifacts that the UI pulls in via
      # `include_bytes!`. CI has no such conflict — `cargo make build` has
      # already produced the wasm, and every test step above likewise builds
      # for the host into the same CARGO_TARGET_DIR. The crate's default
      # target is only wasm by convention of how it is built, not by a
      # `[build] target` setting, so a bare host `cargo test` is correct.
      #
      # Scope caveat, so this is not over-read: on native targets
      # `DelegateCtx`'s `set_secret` is a no-op and `get_secret` always returns
      # `None` (freenet-stdlib's stub — see the cfg at handlers.rs:190). These
      # tests cover dispatch and pure-value logic, NOT storage round-trips.
      run: cargo test -p chat-delegate

    - name: Test web-container-contract + web-container-tool
      env:
        RUST_MIN_STACK: 8388608
        CARGO_TARGET_DIR: ${{ github.workspace }}/target
      # Same gap as the chat-delegate, found while fixing it: 9 tests
      # (6 lib + 2 integration + 1 in the tool) that `Makefile.toml` knows how
      # to run and no workflow ever did. Includes
      # `test_tool_and_contract_compatibility`, which pins that the signing
      # tool and the verifying contract agree on the parameter encoding.
      run: cargo test -p web-container-contract -p web-container-tool

  ui-playwright-tests:
    runs-on: freenet-default-runner

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown

    - name: Cache cargo
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Cache cargo-make
      uses: actions/cache@v3
      with:
        path: ~/.cargo/bin/cargo-make
        key: ${{ runner.os }}-cargo-make

    - name: Install cargo-make
      uses: actions-rs/cargo@v1
      with:
        command: install
        args: --force cargo-make

    - name: Install cargo-binstall
      uses: taiki-e/install-action@cargo-binstall

    - name: Cache Dioxus CLI
      id: cache-dioxus-cli
      uses: actions/cache@v3
      with:
        path: ~/.cargo/bin/dx
        # Re-key on ui/Cargo.toml so a dioxus version bump invalidates the
        # cached `dx` rather than pinning it to a stale CLI version forever.
        key: ${{ runner.os }}-dioxus-cli-${{ hashFiles('ui/Cargo.toml') }}

    - name: Install Dioxus CLI
      # Gate on the cache *result*, not on whether the file exists:
      # freenet-default-runner is self-hosted, so a stale ~/.cargo/bin/dx can
      # persist from an earlier job even when this key misses (e.g. after a
      # dioxus bump). A file-existence check would then skip the install and
      # use the stale CLI; a cache-key miss must always (re)install.
      #
      # Pass GITHUB_TOKEN so binstall makes authenticated GitHub API requests
      # (5000/hr) instead of unauthenticated ones (60/hr). The unauthenticated
      # limit was getting hit, returning 403, forcing a from-source build that
      # then failed on a broken transitive dep (freenet/river#316).
      if: steps.cache-dioxus-cli.outputs.cache-hit != 'true'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: cargo binstall -y --force dioxus-cli

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Tailwind and build CSS
      run: npm install && npm run build:css
      working-directory: ./ui

    - name: Install Playwright test dependencies
      run: npm install
      working-directory: ./ui/tests

    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium firefox webkit
      working-directory: ./ui/tests

    # Build from the committed Cargo.lock (freenet/river#2776 A1). The old
    # `cargo generate-lockfile` + `cargo update --precise` dance re-resolved the
    # graph from scratch every run; it existed only because the lock was
    # gitignored. The committed lock now carries the rustc-1.94.1-compatible
    # pins, so no per-run patching is needed.
    - name: Build UI with example data
      run: cargo make build-ui-example-no-sync

    - name: Start dev server and wait for readiness
      run: |
        cd ui && dx serve --port 8082 --features example-data,no-sync &
        echo "Waiting for dev server to serve the app..."
        SERVER_READY=false
        for i in $(seq 1 90); do
          if curl -s http://localhost:8082 2>/dev/null | grep -q "river-ui"; then
            echo "Server ready after $((i * 3))s"
            sleep 5
            SERVER_READY=true
            break
          fi
          sleep 3
        done
        if [ "$SERVER_READY" != "true" ]; then
          echo "ERROR: Dev server failed to start within 270s"
          exit 1
        fi

    - name: Run Playwright tests
      run: npx playwright test
      working-directory: ./ui/tests

    # `always()`, not `failure()`: with `retries: 2` an intermittent test is
    # reported as "flaky" and the job still succeeds, so a `failure()` guard
    # threw away the one artifact that could explain it (see freenet/river#538,
    # where the trace was gone and the attached hypothesis turned out to be
    # wrong). The playwright config keeps a trace `on-first-retry`, so this
    # uploads the flake evidence too. On a clean run the directory is empty and
    # this is a no-op.
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: ui/tests/test-results/
        if-no-files-found: ignore

  claude-ci-analysis:
    name: Claude CI Analysis

    runs-on: ubuntu-latest
    needs: [build]
    if: failure() && contains(github.event.pull_request.labels.*.name, 'claude-debug')

    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude CI Analysis
        uses: anthropics/claude-code-action@v1
        with:
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            The CI workflow has failed. Please analyze the failure and provide:
            1. Root cause of the failure
            2. Specific steps to fix the issue
            3. Whether this appears to be a flaky test or genuine bug
            4. Any relevant context from the codebase

            Use the repository's CLAUDE.md for guidance on testing and debugging.

            After your analysis, use `gh pr comment` with your Bash tool to post your findings as a comment on the PR.

          claude_args: '--allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh api:*),Bash(gh run view:*)"'
