name: Check Room-Contract Migration

on:
  pull_request:

# Least-privilege floor: this gate only reads the repo. Without this block it
# inherits the org default of `write`, handing a third-party runner a
# GITHUB_TOKEN that can push contents and packages. See release-riverctl.yml
# for the same idiom.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check-room-contract-migration:
    # Standard GitHub-hosted runner: free on a public repo. This gate hashes a
    # few files and installs a small tool, so an 8-vCPU Ubicloud runner bought
    # nothing; it cost ~$1.90/month per check (~1 min x ~380 PR runs/month,
    # Oct 2026). Do not move it to a GitHub *larger* runner label: those are
    # billed at $0.022/min even on public repos (see build.yml). Ubicloud is
    # the right home only for jobs that genuinely need the cores.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Install b3sum
      run: command -v b3sum || cargo install b3sum --locked

    - name: Verify committed room-contract WASM changes include a migration entry
      run: |
        ./scripts/check-room-contract-migration.sh --ci \
          "${{ github.event.pull_request.base.sha }}" \
          "${{ github.event.pull_request.head.sha }}"
