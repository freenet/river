# River's native apps. This is deliberately a SEPARATE Cargo workspace from the
# repository root, with its own Cargo.lock.
#
# The root lockfile pins the bytes of the room-contract and chat-delegate WASM,
# and the delegate key is a hash of those bytes. If these apps' UI dependencies
# (rune, wgpu, winit, ...) joined the root workspace, version unification could
# bump a dependency the WASM shares and silently re-key the delegate, orphaning
# every user's stored rooms. Keeping the apps here makes that impossible.
#
# river-app depends on river-core (common/) by path, to read the user's rooms.
# That cannot change the WASM either: the WASM is built from the root workspace,
# with the root lockfile, and this workspace's lockfile is never consulted
# there. Editing common/ still changes the WASM exactly as it does today, and
# any client-only feature added to river-core must stay off for the contract and
# delegate builds (as `migration`, `mentions` and `stored-rooms` are).
# `.github/workflows/apps.yml` runs for `common/**` changes so a change there
# that breaks the apps is caught.
#
# Two files outside apps/ are compiled in, with `include_bytes!`: the web UI's
# logo, `ui/assets/river_logo.svg`, and the chat delegate WASM,
# `ui/public/contracts/chat_delegate.wasm`, whose hash is the delegate key the
# app reads rooms from. Those are file reads, not crate dependencies, so they
# cannot touch the WASM; apps.yml runs when they change.
[workspace]
resolver = "3"
members = ["river-app", "desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-only"
authors = ["Freenet Project"]

[workspace.dependencies]
# Rune is pre-release and git-only. Pin a rev of its `dev` branch (which is
# never rewritten) and bump it deliberately, re-rendering the snapshots.
rune = { git = "https://github.com/anomalyco/rune", rev = "7ead7d63fcf6f9dd9669385a8b90e2ae80015d7b" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "7ead7d63fcf6f9dd9669385a8b90e2ae80015d7b" }
river-app = { path = "river-app" }

# The signature and hash crates are slow unoptimized, and the room tests verify
# signatures. Debug and test builds only, as in the root workspace.
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.ed25519-dalek]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.blake3]
opt-level = 3

# Release builds are what the desktop release workflow ships
# (.github/workflows/release-desktop.yml). Strip debug info only: symbol names stay, so a
# panic backtrace from a user still names functions.
[profile.release]
strip = "debuginfo"
lto = "thin"
