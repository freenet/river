[package]
name = "river-desktop"
description = "River desktop app: finds or installs a local Freenet node, then runs River"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "river"
path = "src/main.rs"

[features]
# Lets a release-profile build be pointed at a local update server (the CI check and
# scripts/update-e2e.sh). Debug builds have it anyway. Never enabled in a release.
test-hooks = []

[dependencies]
river-app.workspace = true
rune.workspace = true
# Blocking HTTP over rustls: the installer runs on a worker thread, never the UI thread.
ureq = { version = "2", default-features = false, features = ["tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = "2"
hex = "0.4"
flate2 = "1"
tar = "0.4"
tempfile = "3"
directories = "6"
# The tray icon's pixels, decoded from the packaging PNG.
png = "0.18"
# The single-instance token.
getrandom = "0.3"

# OS notifications (src/notify/). MIT OR Apache-2.0. Linux speaks D-Bus through zbus (the `z`
# feature, no libdbus); the notification images feature is off.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
notify-rust = { version = "4.19", default-features = false, features = ["z"] }
# The tray icon on Linux: the StatusNotifierItem protocol over D-Bus, in pure Rust (no GTK, no
# libappindicator), on the same zbus and async-io the notifications use. Unlicense.
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }

# The tray icon on Windows and macOS (MIT OR Apache-2.0); its Linux backend needs GTK, so Linux
# uses ksni above instead.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = { version = "0.21", default-features = false }

# macOS uses UNUserNotificationCenter (the default NSUserNotification backend is deprecated).
[target.'cfg(target_os = "macos")'.dependencies]
notify-rust = { version = "4.19", default-features = false, features = ["preview-macos-un"] }

# Windows toasts, and the registry and shell calls that give them River's name and icon. The
# same windows-sys version rune already uses.
[target.'cfg(windows)'.dependencies]
notify-rust = { version = "4.19", default-features = false }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Registry", "Win32_UI_Shell"] }

# Icon and version resource for river.exe (build.rs). Windows only, so Linux and macOS builds
# never compile it.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
