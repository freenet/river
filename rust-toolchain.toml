[toolchain]
# No `channel`: rustup uses its default toolchain (stable). The committed
# chat_delegate.wasm and room_contract.wasm, not the compiler, fix the delegate
# and room contract keys (key = BLAKE3 of the WASM, plus parameters). Nothing
# rebuilds them to match a committed key; CI only checks that the committed
# files agree with each other, the migration lists and the pointer records.
#
# A compiler change therefore cannot re-key anything. An intentional rebuild
# goes through `cargo make add-migration`, `cargo make sync-wasm` and
# `cargo make sign-pointer-records`, in one PR with the new WASMs. That rebuild
# re-keys whatever compiler it uses, and the migration entry covers it.
#
# The apps/ workspace has its own rust-toolchain.toml (Rune needs a newer rustc).
components = ["rustfmt", "clippy"]
targets = ["wasm32-unknown-unknown"]
